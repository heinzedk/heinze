<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Behind-the-scenes SEO metadata for Google -->
    <title>Peter Bjørn Heinze</title>
    <meta name="description" content="Official digital business card for Peter Bjørn Heinze. Chief Adviser and Lieutenant Colonel, Denmark.">
    <link rel="canonical" href="https://heinze.co" />
    
    <!-- Standard, Bulletproof Favicon linking directly to your uploaded 'H' PNG image -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- ADVANCED GOOGLE KNOWLEDGE PANEL OPTIMIZATION (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://heinze.co",
      "name": "Peter Bjørn Heinze",
      "nationality": {
        "@type": "Country",
        "name": "Denmark"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "DK"
      },
      "jobTitle": [
        "Chief Adviser",
        "Lieutenant Colonel"
      ],
      "worksFor": [
        {
          "@type": "Organization",
          "name": "Ministry of Foreign Affairs of Denmark",
          "sameAs": "https://wikidata.org"
        },
        {
          "@type": "Organization",
          "name": "Danish Defence",
          "sameAs": "https://wikidata.org"
        }
      ],
      "affiliation": [
        {
          "@type": "Organization",
          "name": "Ministry of Foreign Affairs of Denmark",
          "sameAs": "https://wikidata.org"
        },
        {
          "@type": "Organization",
          "name": "Danish Defence",
          "sameAs": "https://wikidata.org"
        }
      ],
      "knowsLanguage": [
        {
          "@type": "Language",
          "name": "Danish",
          "alternateName": "da"
        },
        {
          "@type": "Language",
          "name": "English",
          "alternateName": "en"
        },
        {
          "@type": "Language",
          "name": "French",
          "alternateName": "fr"
        }
      ],
      "url": "https://heinze.co",
      "image": "https://heinze.co",
      "sameAs": [
        "https://linkedin.com"
      ]
    }
    </script>

    <style>
        /* Reset and background settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            /* Custom slate/douche blue color background */
            background-color: #4A607A; 
            /* Typography fully updated to Calibri with professional fallback */
            font-family: 'Calibri', 'Segoe UI', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
        }

        /* Content container */
        .card {
            text-align: center;
            max-width: 450px;
            padding: 20px;
        }

        /* Profile image styling - Præcis 225px bred og høj */
        .profile-img {
            width: 225px;
            height: 225px;
            border-radius: 14px; /* Flot afstemt afrunding til den nye skala */
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: 0 5px 22px rgba(0, 0, 0, 0.15); /* Elegant, mellemdyb skygge */
        }

        /* Name styling - Skaleret til at matche de 225px perfekt */
        h1 {
            font-size: 1.75rem; /* Finjusteret størrelse til 225px bredden */
            font-weight: 500;  
            text-transform: uppercase;
            letter-spacing: 0.05em; 
            margin-bottom: 30px;
            white-space: nowrap; 
        }

        /* Link container */
        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Professional LinkedIn Button - Låst til nøjagtig 225px bredde */
        .btn-linkedin {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 0; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1.02rem; 
            font-weight: 400;   
            transition: all 0.3s ease;
            letter-spacing: 0.03em;
            white-space: nowrap; 
            width: 225px; /* Låst til præcis 225px bredde for perfekt symmetri */
        }

        /* Smooth shift to LinkedIn's official professional corporate blue on hover */
        .btn-linkedin:hover {
            background-color: #0077B5;
            border-color: #0077B5;
            color: #FFFFFF;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 119, 181, 0.3);
        }

        /* Mobil-justering så det ikke klemmer på de absolut mindste skærmstørrelser */
        @media (max-width: 360px) {
            .profile-img {
                width: 190px;
                height: 190px;
            }
            h1 {
                font-size: 1.4rem;
                letter-spacing: 0.03em;
            }
            .btn-linkedin {
                width: 190px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Picture (Præcis 225px bredt) -->
        <img src="profil.jpg" alt="PETER BJØRN HEINZE" class="profile-img">
        
        <!-- Name -->
        <h1>Peter&nbsp;Bjørn&nbsp;Heinze</h1>
        
        <!-- Action items -->
        <div class="links">
            <!-- LinkedIn knap - Præcis 225px bred for fuldkommen lodret symmetri -->
            <a href="https://linkedin.com/in/heinze" class="btn-linkedin" target="_blank">linkedin.com/in/heinze</a>
        </div>
    </div>

</body>
</html>
