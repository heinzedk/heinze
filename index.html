<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Behind-the-scenes SEO metadata for Google -->
    <title>Peter Bjørn Heinze</title>
    <meta name="description" content="Official digital business card for Peter Bjørn Heinze. Chief Adviser and Lieutenant Colonel.">
    <link rel="canonical" href="https://heinze.co" />
    
    <!-- Standard, Bulletproof Favicon linking directly to your uploaded 'H' PNG image -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- ADVANCED GOOGLE KNOWLEDGE PANEL OPTIMIZATION (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://heinze.co",
      "name": "Peter Bjørn Heinze",
      "jobTitle": [
        "Chief Adviser",
        "Lieutenant Colonel"
      ],
      "worksFor": [
        {
          "@type": "Organization",
          "name": "Ministry of Foreign Affairs of Denmark",
          "sameAs": "https://wikidata.org"
        },
        {
          "@type": "Organization",
          "name": "Danish Defence",
          "sameAs": "https://wikidata.org"
        }
      ],
      "knowsLanguage": [
        {
          "@type": "Language",
          "name": "Danish",
          "alternateName": "da"
        },
        {
          "@type": "Language",
          "name": "English",
          "alternateName": "en"
        },
        {
          "@type": "Language",
          "name": "French",
          "alternateName": "fr"
        }
      ],
      "url": "https://heinze.co",
      "image": "https://heinze.co",
      "sameAs": [
        "https://linkedin.com"
      ]
    }
    </script>

    <style>
        /* Reset and background settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            /* Custom slate/douche blue color background */
            background-color: #4A607A; 
            /* Typography fully updated to Calibri with professional fallback */
            font-family: 'Calibri', 'Segoe UI', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
        }

        /* Content container - Tilbage til det rene, åbne og fritflyvende layout */
        .card {
            text-align: center;
            max-width: 450px;
            padding: 20px;
        }

        /* Profile image styling - Square with elegant rounded corners */
        .profile-img {
            width: 190px;
            height: 190px;
            border-radius: 12px; /* Smooth, elegant rounded corners */
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); /* Diskret skygge under foto */
        }

        /* Name styling - Forced to ALL CAPS (Versaler) */
        h1 {
            font-size: 1.7rem; 
            font-weight: 500;  /* Bevarer den perfekte Medium vægt for flot karakter */
            text-transform: uppercase;
            letter-spacing: 0.05em; /* Afstand mellem bogstaver */
            margin-bottom: 30px;
            white-space: nowrap; /* Forbyder teksten i at knække i to linjer */
        }

        /* Link container */
        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Professional LinkedIn Button with branding integration */
        .btn-linkedin {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 0; /* Højde bevares, men side-padding fjernes da bredden nu er låst */
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1.02rem; /* Justeret en mikroskopisk smule for at stå fejlfrit på 190px bredde */
            font-weight: 400;   
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
            white-space: nowrap; 
            width: 190px; /* RETTET: Låst til nøjagtig samme bredde som profilbilledet ovenfor */
        }

        /* Smooth shift to LinkedIn's official professional corporate blue on hover */
        .btn-linkedin:hover {
            background-color: #0077B5;
            border-color: #0077B5;
            color: #FFFFFF;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 119, 181, 0.3);
        }

        /* Specialjustering til meget små mobilskærme, så navnet altid passer på én linje */
        @media (max-width: 360px) {
            h1 {
                font-size: 1.35rem;
                letter-spacing: 0.03em;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Picture (190px bredt) -->
        <img src="profil.jpg" alt="PETER BJØRN HEINZE" class="profile-img">
        
        <!-- Name -->
        <h1>Peter&nbsp;Bjørn&nbsp;Heinze</h1>
        
        <!-- Action items -->
        <div class="links">
            <!-- LinkedIn knap - Nu nøjagtig 190px bred for perfekt symmetri -->
            <a href="https://linkedin.com/in/heinze" class="btn-linkedin" target="_blank">linkedin.com/in/heinze</a>
        </div>
    </div>

</body>
</html>
